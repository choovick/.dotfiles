# DOCS: https://docs.atuin.sh/latest/configuration/config

style = "auto"

enter_accept = true

# Store failed
store_failed = true

[sync]
# Enable sync v2 by default
# This ensures that sync v2 is enabled for new installs only
# In a later release it will become the default across the board
records = true

# https://docs.atuin.sh/latest/configuration/config/#tmux
[tmux]
enabled = true
width = "100%"
height = "80%"
