# TUIOS Configuration File
# This file allows you to customize appearance and keybindings
#
# Configuration location: /Users/sjc-lp03734/Library/Application Support/tuios/config.toml
# Documentation: https://github.com/Gaurav-Gosain/tuios
# For keybindings documentation, run: tuios keybinds list
#
# tuios watches this file. A save takes effect at once, with no restart.
# tuios does not apply a file that has an error. It keeps the settings that
# are in use and shows the error on screen.

# ============================================================================
# APPEARANCE SETTINGS
# ============================================================================
# Many of these can be changed live from the in-app settings page
# (open it with the leader key followed by ',').
#
# border_style: rounded, normal, thick, double, hidden, block, ascii,
#               outer-half-block, inner-half-block
# dockbar_position: bottom, top, hidden
# window_title_position: bottom, top, hidden
# window_button_style: pill, dots (macOS traffic lights)
# window_button_position: right, left. Independent of the style; dots and
#               left is the shipped pair, the macOS arrangement
# theme: color theme name (e.g. dracula, nord); empty for terminal colors
# click_to_type: single (a click on a pane starts typing in it), double
#               (two clicks do), off (a click only focuses)
# auto_enter_terminal_on_focus: off (Tab keeps cycling windows),
#               targeted (numbered select and arrows start typing),
#               all (every covered focus command, including Tab)
# [appearance.scrollbar]: style = thin, track; thumb/track = a one-cell glyph
#               (track also takes "none"); tint = border, muted, #RRGGBB
# background: off (your terminal shows through), theme (the theme's
#               background), or #RRGGBB, for every surface at once
# pane_background, desktop_background, window_chrome_background,
#               dock_background, [appearance.sidebar] background: the same
#               values for one surface; empty follows background, and a
#               colour a program or the chrome chose always wins
# ============================================================================

# ============================================================================
# KEYBINDINGS
# ============================================================================
# Set an action to [] to unbind it and hand the key back to the shell.
# An empty list and a missing line are not the same thing. A line this file
# does not have gets its default back the next time tuios starts; an action
# set to [] stays empty.
#
# You do not have to edit this by hand. In tuios, open the keybind manager
# (leader then k, or the command palette) and press ctrl+d on a binding to
# remove it, or ctrl+x to take its key off every action. From a shell:
#
#   tuios keybinds unbind close_window w   # one key off one action
#   tuios keybinds free alt+left           # off every action
#
# `tuios keybinds doctor` says which binding in each scope is live, what
# clashes with what, and which keys never reach the program in the pane.
#
# [keybindings.global] acts in window mode and terminal mode alike. It binds
# ctrl+p to the command palette and alt+space to the launcher, which costs
# you fish's history-back and readline's set-mark. To move or drop either:
#
#   [keybindings.global]
#   command_palette = ["ctrl+shift+p"]
#   launcher = []
#
# [keybindings.terminal_mode] binds alt+arrows to move focus between panes.
# In readline, fish and zsh, alt+left and alt+right move the cursor a word
# at a time. If you want those back:
#
#   [keybindings.terminal_mode]
#   terminal_focus_left = []
#   terminal_focus_right = []
#
# alt+up and alt+down are unclaimed by the common shells, so they are the
# safer pair to keep.
#
# shift+pgup and shift+pgdown scroll one page. middle pastes from the host
# clipboard. Write ctrl+middle to add a modifier.
#
# hold_window_mode binds a key that puts tuios in window-management mode for
# as long as it is physically held, and hands the previous mode back when it
# is let go:
#
#   [keybindings.mode_control]
#   hold_window_mode = ["leftalt"]
#
# It needs a terminal that speaks the Kitty keyboard protocol (Ghostty, kitty,
# WezTerm, foot, Alacritty; not Terminal.app), because nothing else reports
# that a key was released. Naming a modifier key (leftalt, rightalt, leftctrl,
# leftsuper) asks the terminal for one more thing on top: every keystroke in
# the session then arrives as an escape code. Any ordinary key (f13 to f63,
# scrolllock, a spare letter) avoids that. Unbound by default.
# ============================================================================

# ============================================================================
# DOCK COMPONENTS
# ============================================================================
# The dock is three ordered lists of component names. Leave [dock] out
# entirely and the bar draws what it always drew; write the lists to
# reorder it, and omit a name to drop that segment.
#
#   [dock]
#   left   = ["mode", "workspaces", "trail", "tape"]
#   center = ["windows"]
#   right  = ["notifications", "copy-help", "cpu", "ram", "clock", "session-controls"]
#
# A cell of your own is a command whose first line of stdout is the text:
#
#   [dock.custom.branch]
#   command = "git branch --show-current"
#   refresh = "event:after-focus-change"   # or once, push, or "30s"
#
# and then "custom/branch" in one of the lists above. A component that
# fails is hidden rather than left showing a stale value;
# `tuios list-dock-components` says which and why.
# ============================================================================

[startup]
tiled = true
daemon = true

# Match tmux/herdr tab navigation (Ghostty sends Ctrl+Tab as CSI-u):
#   Ctrl+Tab / Ctrl+Shift+Tab → next / previous workspace
[keybindings.global]
next_workspace = ["ctrl+tab"]
prev_workspace = ["ctrl+shift+tab"]
# Sync panes (tmux synchronize-panes): put every pane on the workspace in multifocus so typing goes to all
# of them; press again to clear.
toggle_multifocus_all = ["ctrl+alt+space"]

# Match tmux/herdr splits: prefix+h side by side, prefix+v stacked.
# review moved off v (G is free; r is rename_window) to make room.
[keybindings.prefix_mode]
prefix_split_vertical = ["h", "|", "\\"]
prefix_split_horizontal = ["v", "-"]
prefix_review = ["G"]
# ctrl+b space enters copy/scrollback mode (like tmux prefix+[). Tiling toggle keeps ctrl+b t t and window-mode t.
prefix_selection = ["[", "space"]
prefix_toggle_tiling = []

# Navigate panes like herdr/tmux: Ctrl+hjkl (Alt+arrows kept as default).
[keybindings.terminal_mode]
terminal_focus_left = ["ctrl+h", "alt+left"]
terminal_focus_down = ["ctrl+j", "alt+down"]
terminal_focus_up = ["ctrl+k", "alt+up"]
terminal_focus_right = ["ctrl+l", "alt+right"]

# Keep up to 1M lines of each pane's history across daemon restarts.
[daemon]
persist_scrollback_lines = 1000000
# Resume each pane's agent conversation after a daemon restart (claude --resume <id>).
resume_agents = "auto"

# Lines each pane keeps in scrollback (read at daemon start; applies to new panes).
[appearance]
scrollback_lines = 1000000
# Let the Neovim navigator plugin (tuios-nvim-navigator) hand C-hjkl focus back to TUIOS.
nvim_navigation = true
# Stay in terminal mode: a focus command or a single click starts typing in the pane (Tab included).
auto_enter_terminal_on_focus = "all"
click_to_type = "single"

[plugins]
enabled = ["herdr-splits"]

# Resize like herdr: Alt+hjkl run the herdr-splits plugin actions (nvim-aware: forwarded to nvim when it is
# the foreground program, otherwise resizes the TUIOS pane).
# TUIOS 0.10.1 has no `plugin_action` key type yet (newer docs do), so use `shell` + the plugins CLI.
#
# One-time setup, run from a terminal OUTSIDE TUIOS (enable/disable/link are refused inside a pane):
#   tuios plugins enable herdr-splits
# TUIOS finds the plugin in herdr's folder (~/.config/herdr/plugins), so herdr must have it installed.
# Check with: tuios plugins list   (herdr-splits should be "on")

[[keybindings.command]]
key = "alt+h"
type = "shell"
command = "/opt/homebrew/bin/tuios plugins run herdr-splits resize-left"
description = "Resize left (nvim-aware)"

[[keybindings.command]]
key = "alt+j"
type = "shell"
command = "/opt/homebrew/bin/tuios plugins run herdr-splits resize-down"
description = "Resize down (nvim-aware)"

[[keybindings.command]]
key = "alt+k"
type = "shell"
command = "/opt/homebrew/bin/tuios plugins run herdr-splits resize-up"
description = "Resize up (nvim-aware)"

[[keybindings.command]]
key = "alt+l"
type = "shell"
command = "/opt/homebrew/bin/tuios plugins run herdr-splits resize-right"
description = "Resize right (nvim-aware)"

# ctrl+b y: open the focused pane's full scrollback in nvim in a popup (copy mode has no block select;
# nvim has ctrl+v). It is a shell key because a popup starts focused, so it could not tell which pane to
# capture. Read-only copy, starts at the end, temp file removed when nvim exits.
[[keybindings.command]]
key = "prefix+y"
type = "shell"
command = 'f=$(mktemp "${TMPDIR:-/tmp}/tuios-scrollback.XXXXXX") && /opt/homebrew/bin/tuios capture-pane --scrollback --lines 0 > "$f" && /opt/homebrew/bin/tuios popup --width 95% --height 90% -- sh -c "/opt/homebrew/bin/nvim -R +\"normal G\" \"$f\"; rm -f \"$f\""'
description = "Scrollback in nvim"

# ctrl+b Y: open the output of the last finished command in the focused pane in nvim in a popup
# (same as ctrl+b y, but only that command). Needs the OSC 133 marks from zsh/.zshrc (only set inside
# TUIOS panes), so panes opened before that change show nothing. Empty output opens nothing.
[[keybindings.command]]
key = "prefix+Y"
type = "shell"
command = 'f=$(mktemp "${TMPDIR:-/tmp}/tuios-lastcmd.XXXXXX") && /opt/homebrew/bin/tuios capture-pane --last-command > "$f" 2>/dev/null; if [ -s "$f" ]; then /opt/homebrew/bin/tuios popup --width 95% --height 90% -- sh -c "/opt/homebrew/bin/nvim -R +\"normal G\" \"$f\"; rm -f \"$f\""; else rm -f "$f"; fi'
description = "Last command output in nvim"
