# Herdr config (stowed from .dotfiles/herdr)
#
# After first install / update:
#   herdr plugin install lmilojevicc/herdr-splits.nvim
#   herdr server reload-config
#
# Seamless nvim ↔ Herdr pane navigation/resize (mirrors tmux C-hjkl / A-hjkl).

onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

# Match tmux splits from ~/.tmux.conf:
#   prefix+h → side by side (tmux split-window -h)
#   prefix+v → stacked      (tmux split-window -v)
# Herdr names these opposite to tmux flags: split_vertical = side-by-side.
#
# Match tmux window/tab navigation (via Ghostty Ctrl+Tab → CSI-u):
#   Alt+1..9         → jump to tab 1-9
#   Ctrl+Tab         → next tab   (Ghostty sends CSI 9;5u)
#   Ctrl+Shift+Tab   → previous   (Ghostty sends CSI 9;6u)
[keys]
split_vertical = "prefix+h"
split_horizontal = "prefix+v"
switch_tab = ["prefix+1..9", "alt+1..9"]
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (nvim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down (nvim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up (nvim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right (nvim-aware)"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left (nvim-aware)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down (nvim-aware)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up (nvim-aware)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right (nvim-aware)"
